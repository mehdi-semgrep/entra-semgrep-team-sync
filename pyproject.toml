[project]
name = "entra-semgrep-team-sync"
version = "0.1.0"
description = "Sync Microsoft Entra ID group members and owners into Semgrep teams via the Semgrep Teams API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
entra-team-sync = "entra_team_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entra_team_sync"]

[tool.uv]
# Supply-chain guard: ignore package releases newer than a week.
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]
